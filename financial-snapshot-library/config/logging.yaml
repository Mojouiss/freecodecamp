# Logging Configuration
# This file configures Python's logging system using YAML format
# Can be loaded with logging.config.dictConfig()

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(process)d:%(thread)d] - %(filename)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/snapshot.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  financial_snapshot:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  financial_snapshot.core:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  financial_snapshot.messaging:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  financial_snapshot.storage:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  confluent_kafka:
    level: WARNING
    handlers: [console, file]
    propagate: false
  
  sqlalchemy:
    level: WARNING
    handlers: [file]
    propagate: false

root:
  level: INFO
  handlers: [console, file, error_file]
